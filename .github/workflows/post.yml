name: post

# Tops Buffer's queue back up. Buffer does the actual posting to X on its own
# schedule, so this job does not need to run at posting time — it only needs to
# run often enough that the queue never empties.
#
# The schedule is COMMENTED OUT deliberately. Enable it only after
# `viralinator verify` passes and you have watched one supervised `draft` run.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */12 * * *"   # every 12h — queue holds 8, drains ~3/day

concurrency:
  group: viralinator-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The SQLite file carries the spend ledger and learned format weights.
      # Rolling key: every run writes a fresh cache, restore-keys picks up the
      # most recent one. If the cache is ever evicted the weights reset to
      # their priors — not fatal, just a loss of learning.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/
          key: viralinator-db-${{ github.run_id }}
          restore-keys: viralinator-db-

      - name: Install
        run: pip install --quiet -e .

      - name: Top up queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m viralinator.cli run

      - name: Status
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m viralinator.cli status
