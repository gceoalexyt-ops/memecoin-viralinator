name: post

# Tops Buffer's queue back up from the pre-screened content bank. Buffer does
# the actual posting to X on its own schedule, so this job only needs to run
# often enough that the queue never empties.
#
# Note what this job does NOT need: an Anthropic API key. Posts were written
# and screened ahead of time and live in config/bank.json, so the only
# credential in play is the Buffer token. Nothing here can expire quietly,
# overrun a budget, or fail on a rate limit.
#
# Live. The verify workflow passed against the real Buffer API on 2026-09-21
# and a dispatch run queued 8 posts successfully, so the schedule is enabled.
#
# To stop it: run `viralinator pause` (creates a PAUSED file the job checks
# first), or comment the schedule back out.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # every 12h — queue holds 8, drains ~3/day

permissions:
  contents: write   # to commit the consumed bank back

concurrency:
  group: viralinator-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Holds learned format weights. Consumption state lives in the bank file
      # and is committed, not cached — the cache can be evicted, git cannot.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/
          key: viralinator-db-${{ github.run_id }}
          restore-keys: viralinator-db-

      - name: Install
        run: pip install --quiet -e .

      - name: Push to Buffer queue
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m viralinator.cli run

      # Records which posts have been used. `git log config/bank.json` becomes
      # a readable history of what went out and when.
      - name: Commit consumed bank
        run: |
          set -eu
          if git diff --quiet -- config/bank.json; then
            echo "bank unchanged"
            exit 0
          fi
          git config user.name  "viralinator"
          git config user.email "noreply@github.com"
          git add config/bank.json
          git commit -m "chore: mark banked posts as published [skip ci]"
          git push
