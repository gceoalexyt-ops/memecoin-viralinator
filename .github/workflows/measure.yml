name: measure

# Pulls performance data for posts that have had time to settle and feeds it
# back into the format weights.
#
# Enable this only once a metrics source is actually wired up — see the note in
# cli.py::cmd_measure. Until then it reports and changes nothing.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"   # daily, well after the previous day's posts

concurrency:
  group: viralinator-measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/
          key: viralinator-db-${{ github.run_id }}
          restore-keys: viralinator-db-

      - name: Install
        run: pip install --quiet -e .

      - name: Measure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m viralinator.cli measure
