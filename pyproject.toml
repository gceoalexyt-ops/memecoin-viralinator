[project]
name = "viralinator"
version = "0.1.0"
description = "Autonomous X content pipeline for $TUFFTUNG4"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
viralinator = "viralinator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
