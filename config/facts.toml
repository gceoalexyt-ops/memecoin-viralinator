# The ONLY facts the generator is allowed to assert.
#
# The guard's fact-binding step checks every claim the semantic judge flags
# against this file. A number, date, or verifiable statement that is not here
# gets the post rejected — the model cannot invent a holder count, a listing,
# a partnership, or a milestone.
#
# Keep this current. An out-of-date fact here becomes a false statement on a
# public account tied to a financial asset.

# Contains only verifiable physical properties of tungsten — nothing about the
# token's price, supply, holders, or prospects, and nothing that can go stale.
#
# These exist so the cube can be specific. "I am extremely dense" is a shrug;
# "19.25 grams per cubic centimetre" is a joke with a number in it. The guard
# rejects any assertion not on this list, so being able to cite real physics is
# what lets the voice have texture without inventing anything.

# Attested by the owner on 2026-09-21, with the pump.fun URL. Durable: it does
# not go stale the way a holder count or market cap would. Without it the guard
# rejects any post saying the coin exists anywhere, which rules out the whole
# "it's live, go look" register that actually performs.
